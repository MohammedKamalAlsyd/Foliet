name: Release Foliet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows (x64)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS (Apple Silicon)"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux (x64)"
        type: boolean
        default: true
      build_msix:
        description: "Build Windows Microsoft Store package (MSIX)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, Tests & Version Check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify synchronized manifest versions
        run: node scripts/bump-version.mjs --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run frontend test suite
        run: pnpm test

      - name: Compute build matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
        run: |
          node -e '
            const fs = require("node:fs");
            const isDispatch = process.env.EVENT_NAME === "workflow_dispatch";
            const include = [];
            if (!isDispatch || process.env.BUILD_MACOS === "true") {
              include.push({
                label: "macOS Apple Silicon (aarch64)",
                os_key: "macos",
                platform: "macos-latest",
                args: "--target aarch64-apple-darwin",
                rust_target: "aarch64-apple-darwin",
              });
            }
            if (!isDispatch || process.env.BUILD_LINUX === "true") {
              include.push({
                label: "Linux (ubuntu-24.04)",
                os_key: "linux",
                platform: "ubuntu-24.04",
                args: "",
                rust_target: "",
              });
            }
            if (!isDispatch || process.env.BUILD_WINDOWS === "true") {
              include.push({
                label: "Windows (x64)",
                os_key: "windows",
                platform: "windows-latest",
                args: "",
                rust_target: "",
              });
            }
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `matrix=${JSON.stringify({ include })}\n`,
            );
          '

  publish-tauri:
    name: Build & Publish (${{ matrix.label }})
    needs: verify
    if: ${{ needs.verify.outputs.matrix != '{"include":[]}' }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri Linux system dependencies
        if: matrix.os_key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            appstream \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests (secrets & core)
        if: matrix.rust_target == ''
        working-directory: src-tauri
        run: cargo test --lib secrets

      - name: Build Tauri bundle & upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.4"
          NO_STRIP: "true"
        with:
          tagName: v__VERSION__
          releaseName: "Foliet v__VERSION__"
          releaseAssetNamePattern: "Foliet-[version]-[platform]-[arch][setup][ext]"
          releaseBody: |
            ### Which file should I download?

            | OS | Recommended Installer | Alternative |
            | :--- | :--- | :--- |
            | **Windows (x64)** | `Foliet-__VERSION__-windows-x86_64-setup.exe` | `Foliet-__VERSION__-windows-x86_64.msi` |
            | **macOS (Apple Silicon)** | `Foliet-__VERSION__-macos-aarch64.dmg` | — |
            | **Linux (Debian / Ubuntu)** | `Foliet-__VERSION__-linux-x86_64.deb` | `Foliet-__VERSION__-linux-x86_64.AppImage` |
            | **Linux (Fedora / RHEL)** | `Foliet-__VERSION__-linux-x86_64.rpm` | `Foliet-__VERSION__-linux-x86_64.AppImage` |

            > **Ignore updater files:** `latest.json` and `*.app.tar.gz` are used automatically by Foliet's in-app updater (cryptographic signatures are embedded inside `latest.json`).
            >
            > **First-launch security note (unsigned open-source builds):**
            > - **Windows SmartScreen:** Click **More info → Run anyway** when running the installer for the first time.
            > - **macOS Gatekeeper:** Drag to Applications, then **Right-click → Open** (or run `xattr -cr /Applications/foliet.app`).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  build-msix:
    name: Build Microsoft Store MSIX (Windows x64)
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_msix == true }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Store-mode Tauri binary (no external self-updater)
        env:
          VITE_STORE_BUILD: "true"
        run: pnpm tauri build --no-bundle

      - name: Package unsigned MSIX for Microsoft Partner Center
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME || vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER || vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME || vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/build-msix.mjs

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-store-package
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error
