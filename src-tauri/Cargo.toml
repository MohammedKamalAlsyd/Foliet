[package]
name = "foliet"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "foliet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-store = "2.5.1"
lopdf = "0.47.0"
sha2 = "0.11.1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }

# RAG: SQLite vector store, ONNX Runtime, Tokenizer, HTTP client, Async
rusqlite = { version = "0.31", features = ["bundled"] }
ort = { version = "2.0.0-rc.15", features = ["ndarray"] }
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = [
    "fancy-regex",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "default-tls",
] }
tokio = { version = "1", features = ["sync", "time", "fs"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-prevent-default = "6.0.1"

# Encrypted API key storage
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Auto-updater and process lifecycle
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
